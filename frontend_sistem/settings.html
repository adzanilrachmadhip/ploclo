<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPASS - Admin Settings</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { purple: '#7C3AED', blue: '#38BDF8', dark: '#0F172A', darker: '#0B1121' } } } } }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-brand-dark min-h-screen text-slate-200 flex" x-data="{ sidebarOpen: true, activeTab: 'users' }">

    <!-- Sidebar (Same as others) -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="glass-panel transition-all duration-300 flex flex-col fixed h-full z-20">
        <div class="h-16 flex items-center justify-between px-4 border-b border-slate-700/50">
            <div class="flex items-center gap-3 overflow-hidden" x-show="sidebarOpen">
                <i data-lucide="compass" class="text-brand-purple w-8 h-8 flex-shrink-0"></i>
                <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">COMPASS</span>
            </div>
        </div>
        <div class="p-4 flex flex-col gap-2 flex-1 overflow-y-auto">
            <a href="dashboard-kaprodi.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i>
                <span x-show="sidebarOpen" class="font-medium">Dashboard</span>
            </a>
            <a href="settings.html" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-brand-purple/20 text-brand-purple border border-brand-purple/30 glow-primary transition-all">
                <i data-lucide="settings" class="w-5 h-5 flex-shrink-0"></i>
                <span x-show="sidebarOpen" class="font-medium">Admin Settings</span>
            </a>
        </div>
    </aside>

    <main :class="sidebarOpen ? 'ml-64' : 'ml-20'" class="flex-1 transition-all duration-300 min-h-screen flex flex-col">
        <header class="h-16 glass-panel border-b border-slate-700/50 flex items-center justify-between px-6 sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <button @click="sidebarOpen = !sidebarOpen" class="text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <h2 class="text-lg font-semibold">System Configuration</h2>
            </div>
            <button class="bg-brand-purple hover:bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center">
                <i data-lucide="save" class="w-4 h-4 mr-2"></i> Save All Settings
            </button>
        </header>

        <div class="p-6 md:p-8 flex-1 overflow-y-auto">
            
            <!-- Tabs -->
            <div class="flex gap-4 border-b border-slate-700 mb-6">
                <button @click="activeTab = 'users'" :class="activeTab === 'users' ? 'border-brand-purple text-brand-purple' : 'border-transparent text-slate-400 hover:text-white'" class="pb-3 border-b-2 font-medium transition-colors px-2">User Management</button>
                <button @click="activeTab = 'academic'" :class="activeTab === 'academic' ? 'border-brand-purple text-brand-purple' : 'border-transparent text-slate-400 hover:text-white'" class="pb-3 border-b-2 font-medium transition-colors px-2">Academic Timeline</button>
                <button @click="activeTab = 'roles'" :class="activeTab === 'roles' ? 'border-brand-purple text-brand-purple' : 'border-transparent text-slate-400 hover:text-white'" class="pb-3 border-b-2 font-medium transition-colors px-2">Roles & Permissions</button>
            </div>

            <!-- User Management Tab -->
            <div x-show="activeTab === 'users'" x-transition.opacity>
                <div class="glass-card rounded-2xl p-6 mb-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-white">Kelola Pengguna (Dosen)</h3>
                        <div class="relative w-64">
                            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                            <input type="text" placeholder="Search dosen..." class="pl-10 pr-4 py-2 bg-slate-900/50 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-brand-purple w-full text-slate-200">
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left text-slate-400">
                            <thead class="text-xs text-slate-300 uppercase bg-slate-800/80">
                                <tr>
                                    <th class="px-6 py-4 rounded-tl-lg">Nama Lengkap</th>
                                    <th class="px-6 py-4">Kode Dosen</th>
                                    <th class="px-6 py-4">Role Utama</th>
                                    <th class="px-6 py-4 text-center">Status</th>
                                    <th class="px-6 py-4 text-right rounded-tr-lg">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="border-b border-slate-700/50">
                                    <td class="px-6 py-4 font-medium text-white">Dr. Berlian Lidiawaty</td>
                                    <td class="px-6 py-4">BR</td>
                                    <td class="px-6 py-4"><span class="bg-brand-purple/20 text-brand-purple px-2 py-1 rounded text-xs font-bold">Kaprodi</span></td>
                                    <td class="px-6 py-4 text-center">
                                        <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input type="checkbox" name="toggle" id="toggle1" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-brand-purple" style="right: 0;"/>
                                            <label for="toggle1" class="toggle-label block overflow-hidden h-5 rounded-full bg-brand-purple cursor-pointer"></label>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button class="text-slate-400 hover:text-white"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                    </td>
                                </tr>
                                <tr class="border-b border-slate-700/50">
                                    <td class="px-6 py-4 font-medium text-white">Dr. Andi Hidayat</td>
                                    <td class="px-6 py-4">AH</td>
                                    <td class="px-6 py-4"><span class="bg-slate-800 text-slate-300 px-2 py-1 rounded text-xs">Dosen Wali</span></td>
                                    <td class="px-6 py-4 text-center">
                                        <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input type="checkbox" name="toggle" id="toggle2" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-brand-purple" style="right: 0;"/>
                                            <label for="toggle2" class="toggle-label block overflow-hidden h-5 rounded-full bg-brand-purple cursor-pointer"></label>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button class="text-slate-400 hover:text-white"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Academic Timeline Tab -->
            <div x-show="activeTab === 'academic'" x-transition.opacity style="display: none;">
                <div class="glass-card rounded-2xl p-6 mb-6">
                    <h3 class="text-lg font-bold text-white mb-6">Konfigurasi Timeline Akademik</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">Tahun Akademik Aktif</label>
                            <select class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-brand-purple block w-full p-3">
                                <option>2023/2024</option>
                                <option selected>2024/2025</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">Semester Aktif</label>
                            <select class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-brand-purple block w-full p-3">
                                <option>Ganjil</option>
                                <option selected>Genap</option>
                            </select>
                        </div>
                        
                        <div class="md:col-span-2 mt-4">
                            <h4 class="text-md font-bold text-white mb-4 border-b border-slate-700 pb-2">Deadline Sistem</h4>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">Batas Input Nilai UTS</label>
                            <input type="date" value="2024-11-15" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-brand-purple block w-full p-3">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2">Batas Input Nilai UAS</label>
                            <input type="date" value="2025-01-20" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-brand-purple block w-full p-3">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
